[package]
name = "swarm-escrow"
description = "Escrow for Swarm-for-Hire jobs: posters deposit, the coordinator can only pay a registered agent within the budget or refund, and posters can reclaim after a timeout."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emer-eth/swarm-for-hire"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
